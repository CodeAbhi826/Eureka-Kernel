name: Build Eureka R15-OneUI + SukiSU Ultra

on:
  workflow_dispatch:
    inputs:
      suki_mode:
        description: 'SukiSU install mode'
        type: choice
        required: true
        default: 'non‑gki'
        options:
          - 'non‑gki (old legacy hooks)'
          - 'gki (LKM)'

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false

    steps:
      - name: Checkout Eureka Kernel source
        uses: actions/checkout@v4
        with:
          repository: eurekadevelopment/Eureka-Kernel
          ref: R15-OneUI
          path: kernel

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make git python3 cpio gcc-aarch64-linux-gnu

      - name: Set up Neutron Clang toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S=10032024
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") --patch=glibc
          cd ..
          echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH

      - name: Set build environment variables
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV

      - name: Patch defconfig for SukiSU Ultra
        working-directory: ./kernel
        run: |
          DEFCONFIG="arch/arm64/configs/exynos7885-a20_defconfig"

          # Ensure required configs are present
          grep -q "CONFIG_KALLSYMS=y" "$DEFCONFIG" || echo "CONFIG_KALLSYMS=y" >> "$DEFCONFIG"
          grep -q "CONFIG_KALLSYMS_ALL=y" "$DEFCONFIG" || echo "CONFIG_KALLSYMS_ALL=y" >> "$DEFCONFIG"
          grep -q "CONFIG_KSU=y" "$DEFCONFIG" || echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          grep -q "CONFIG_KSU_MANUAL_HOOK=y" "$DEFCONFIG" || echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG"

          # Disable KPROBES and LTO (non‑GKI requires manual hooks)
          sed -i 's/^CONFIG_KPROBES=y/# CONFIG_KPROBES is not set/' "$DEFCONFIG"
          sed -i 's/^CONFIG_KRETPROBES=y/# CONFIG_KRETPROBES is not set/' "$DEFCONFIG"
          sed -i 's/^CONFIG_LTO=y/# CONFIG_LTO is not set/' "$DEFCONFIG"

          # Enable SIPHASH if missing
          grep -q "CONFIG_SIPHASH=y" "$DEFCONFIG" || echo "CONFIG_SIPHASH=y" >> "$DEFCONFIG"

          echo "=== Last 12 lines of $DEFCONFIG ==="
          tail -12 "$DEFCONFIG"

      # ── FIX STARTS HERE ──
      - name: Purge previous KernelSU hooks & revert source patches
        working-directory: ./kernel
        run: |
          rm -rf KernelSU
          rm -f drivers/kernelsu
          git checkout -- drivers/Makefile drivers/Kconfig \
            fs/open.c fs/read_write.c fs/stat.c fs/exec.c \
            fs/namespace.c fs/internal.h \
            drivers/input/input.c \
            include/linux/seccomp.h
          echo "Old hooks reverted"

      - name: Set up SukiSU Ultra v3.0 (non‑GKI, manual hooks)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s v3.0
      # ── FIX ENDS HERE ──
      - name: Remove GKI-only MODULE_IMPORT_NS (unsupported on 4.4)
        working-directory: ./kernel
        run: |
          sed -i '/MODULE_IMPORT_NS/d' drivers/kernelsu/ksu.c
          echo "Removed MODULE_IMPORT_NS line from ksu.c"
          
      - name: Create stub compiler_types.h for 4.4 kernel
        working-directory: ./kernel
        run: |
          echo "#include <linux/compiler.h>" > include/linux/compiler_types.h
          echo "Stub created for compiler_types.h"
          
      - name: Scan and fix SukiSU code for kernel 4.4 compatibility
        working-directory: ./kernel
        run: |
          echo "=== Pre‑build compatibility scan for 4.4 ==="

          # 1) Remove GKI‑only MODULE_IMPORT_NS macro
          grep -rIl 'MODULE_IMPORT_NS' drivers/kernelsu/ | while read f; do
            echo "Purging MODULE_IMPORT_NS from $f"
            sed -i '/MODULE_IMPORT_NS/d' "$f"
          done

          # 2) Stub <linux/compiler_types.h>
          if grep -rq '<linux/compiler_types.h>' drivers/kernelsu/; then
            if ! grep -q 'compiler_types' include/linux/compiler_types.h 2>/dev/null; then
              echo '#include <linux/compiler.h>' > include/linux/compiler_types.h
              echo "Created stub for compiler_types.h"
            fi
          fi

          # 3) Replace <linux/sched/task_stack.h> → <linux/sched.h>
          find drivers/kernelsu/ -name '*.c' -o -name '*.h' | while read f; do
            if grep -q '<linux/sched/task_stack.h>' "$f"; then
              echo "Patching $f → task_stack.h → sched.h"
              sed -i 's|<linux/sched/task_stack.h>|<linux/sched.h>|g' "$f"
            fi
          done

          # 4) Replace <linux/sched/task.h> → <linux/sched.h>
          find drivers/kernelsu/ -name '*.c' -o -name '*.h' | while read f; do
            if grep -q '<linux/sched/task.h>' "$f"; then
              echo "Patching $f → sched/task.h → sched.h"
              sed -i 's|<linux/sched/task.h>|<linux/sched.h>|g' "$f"
            fi
          done

          # 5) full_name_hash – remove NULL salt (4.4 has only 2 args)
          find drivers/kernelsu/ -name '*.c' -o -name '*.h' | while read f; do
            if grep -q 'full_name_hash(NULL' "$f"; then
              echo "Patching $f → full_name_hash (remove NULL salt)"
              sed -i 's/full_name_hash(NULL, \([^,]*\), strlen([^)]*))/full_name_hash((const unsigned char *)\1, strlen(\1))/g' "$f"
            fi
          done

          # 6) group_info->gid → GROUP_AT()  (4.4 compatibility)
          find drivers/kernelsu/ -name '*.c' -o -name '*.h' | while read f; do
            if grep -q 'group_info->gid\[' "$f"; then
              echo "Patching $f → group_info->gid → GROUP_AT"
              sed -i 's/group_info->gid\[\([^]]*\)\]/GROUP_AT(group_info, \1)/g' "$f"
            fi
          done

          # 7) security_add_hooks – remove 3rd arg (4.4 compatibility)
          find drivers/kernelsu/ -name '*.c' -o -name '*.h' | while read f; do
            if grep -q 'security_add_hooks(' "$f"; then
              echo "Patching $f → security_add_hooks (remove 3rd arg)"
              sed -i 's/security_add_hooks(\([^,]*\), \([^,]*\), "[^"]*")/security_add_hooks(\1, \2)/g' "$f"
            fi
          done

          # 8) Declare extern selinux_state for 4.4
          if grep -q 'selinux_state.enforcing' drivers/kernelsu/selinux/selinux.c 2>/dev/null; then
            if ! grep -q 'extern struct selinux_state' drivers/kernelsu/selinux/selinux.c; then
              echo "Declaring extern selinux_state for 4.4"
              sed -i '1s/^/#include <linux\/selinux.h>\nextern struct selinux_state selinux_state;\n/' drivers/kernelsu/selinux/selinux.c
            fi
          fi

          echo "=== Compatibility fixes applied ==="
      
           # 7) Declare selinux_state for 4.4 (extern, defined in security.h)
          if grep -q 'selinux_state.enforcing' drivers/kernelsu/selinux/selinux.c 2>/dev/null; then
            if ! grep -q 'extern struct selinux_state selinux_state' drivers/kernelsu/selinux/selinux.c; then
              echo "Patching selinux.c → adding extern selinux_state"
              sed -i '/#include <linux\/.*>/a extern struct selinux_state selinux_state;' drivers/kernelsu/selinux/selinux.c
            fi
          fi
             
             echo "=== Compatibility fixes applied ==="
             
      - name: Build kernel
        working-directory: ./kernel
        run: |
          make O=out ARCH=arm64 exynos7885-a20_defconfig
          make -j$(nproc) O=out ARCH=arm64 \
            CC=${CC} LD=${LD} AR=${AR} NM=${NM} \
            OBJCOPY=${OBJCOPY} OBJDUMP=${OBJDUMP} STRIP=${STRIP} \
            CROSS_COMPILE=${CROSS_COMPILE} 2>&1 | tee build.log

      - name: Check build output
        run: |
          echo "=== Build output ==="
          ls -la kernel/out/arch/arm64/boot/
          if [ ! -f kernel/out/arch/arm64/boot/Image ]; then
            echo "ERROR: No kernel image produced!"
            exit 1
          fi

      - name: Prepare AnyKernel3 package
        run: |
          cp -r kernel/kernel_zip/anykernel anykernel
          cp kernel/out/arch/arm64/boot/Image anykernel/

      - name: Inject custom anykernel.sh (if available)
        run: |
          if [ -f "anykernel3/anykernel.sh" ]; then
            cp anykernel3/anykernel.sh anykernel/
            echo "Custom anykernel.sh injected"
          else
            echo "Using default anykernel.sh from kernel source"
          fi

      - name: Create flashable ZIP
        run: |
          BUILD_NO=$(printf "%03d" ${{ github.run_number }})
          ZIP_NAME="sukisu-kernel-${BUILD_NO}"
          cd anykernel
          zip -r9 "../${ZIP_NAME}.zip" .
          cd ..
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: sukesu-kernel-${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log-sukisu-${{ env.ZIP_NAME }}
          path: kernel/build.log
