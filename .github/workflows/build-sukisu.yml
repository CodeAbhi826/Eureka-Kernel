name: Build Eureka R15-OneUI + SukiSU Ultra (verified)

on:
  workflow_dispatch:
    inputs:
      suki_mode:
        description: 'SukiSU install mode'
        type: choice
        required: true
        default: 'non‑gki'
        options:
          - 'non‑gki (old legacy hooks)'
          - 'gki (LKM)'   # not implemented yet

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false

    steps:
      - name: Checkout Eureka Kernel source
        uses: actions/checkout@v4
        with:
          repository: eurekadevelopment/Eureka-Kernel
          ref: R15-OneUI
          path: kernel

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make git python3 cpio gcc-aarch64-linux-gnu

      - name: Set up Neutron Clang toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S=10032024
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") --patch=glibc
          cd ..
          echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH

      - name: Set build environment variables
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV

      # ─── STEP 1: DEFCONFIG + PRELIMINARY CHECK ───
      - name: Patch defconfig for SukiSU Ultra (non‑GKI)
        working-directory: ./kernel
        run: |
          DEFCONFIG="arch/arm64/configs/exynos7885-a20_defconfig"
          echo "=== Defconfig before patching ==="
          grep -E "CONFIG_KSU|CONFIG_KALLSYMS|CONFIG_KPROBES|CONFIG_LTO|CONFIG_SIPHASH" "$DEFCONFIG" || true

          # Ensure mandatory KSU configs
          grep -q "CONFIG_KALLSYMS=y" "$DEFCONFIG" || echo "CONFIG_KALLSYMS=y" >> "$DEFCONFIG"
          grep -q "CONFIG_KALLSYMS_ALL=y" "$DEFCONFIG" || echo "CONFIG_KALLSYMS_ALL=y" >> "$DEFCONFIG"
          grep -q "CONFIG_KSU=y" "$DEFCONFIG" || echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          grep -q "CONFIG_KSU_MANUAL_HOOK=y" "$DEFCONFIG" || echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG"

          # Disable KPROBES and LTO (manual hooks need these off)
          sed -i 's/^CONFIG_KPROBES=y/# CONFIG_KPROBES is not set/' "$DEFCONFIG"
          sed -i 's/^CONFIG_KRETPROBES=y/# CONFIG_KRETPROBES is not set/' "$DEFCONFIG"
          sed -i 's/^CONFIG_LTO=y/# CONFIG_LTO is not set/' "$DEFCONFIG"

          grep -q "CONFIG_SIPHASH=y" "$DEFCONFIG" || echo "CONFIG_SIPHASH=y" >> "$DEFCONFIG"

          echo "=== Defconfig after patching ==="
          grep -E "CONFIG_KSU|CONFIG_KALLSYMS|CONFIG_KPROBES|CONFIG_LTO|CONFIG_SIPHASH" "$DEFCONFIG"

          # Verify essential KSU symbols exist now
          for sym in CONFIG_KSU=y CONFIG_KALLSYMS=y CONFIG_KALLSYMS_ALL=y; do
            if ! grep -q "^$sym" "$DEFCONFIG"; then
              echo "❌ ERROR: $sym missing from defconfig!"
              exit 1
            fi
          done
          echo "✅ Defconfig is ready for SukiSU manual hooks"

      # ─── STEP 2: CLEAN SLATE – REMOVE OLD DRIVERS & PATCHES ───
      - name: Purge previous KernelSU hooks and drivers
        working-directory: ./kernel
        run: |
          echo "Removing any previous KSU driver..."
          rm -rf drivers/kernelsu KernelSU 2>/dev/null || true
          # Revert possible old hook modifications
          git checkout -- drivers/Makefile drivers/Kconfig \
            fs/open.c fs/read_write.c fs/stat.c fs/exec.c \
            fs/namespace.c fs/internal.h \
            drivers/input/input.c \
            include/linux/seccomp.h
          echo "Old hooks reverted"

      # ─── STEP 3: DOWNLOAD & COPY SUKISU v3.0 KERNEL DRIVER ───
      - name: Download SukiSU v3.0 kernel source
        run: |
          echo "Cloning SukiSU tag v3.0..."
          git clone -b v3.0 --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git /tmp/sukisu

          # Verify the driver directory exists
          if [ ! -d /tmp/sukisu/kernel ]; then
            echo "❌ SukiSU kernel source not found at /tmp/sukisu/kernel"
            exit 1
          fi
          echo "✅ SukiSU kernel source downloaded"

      - name: Install SukiSU driver into kernel tree
        working-directory: ./kernel
        run: |
          echo "Copying SukiSU kernel driver..."
          cp -r /tmp/sukisu/kernel drivers/kernelsu

          # Check that it has the essential files
          for file in Makefile Kconfig ksu.c; do
            if [ ! -f "drivers/kernelsu/$file" ]; then
              echo "❌ Missing drivers/kernelsu/$file"
              exit 1
            fi
          done

          echo "✅ SukiSU driver copied"
          # Show what we got
          ls -l drivers/kernelsu/

      # ─── STEP 4: APPLY MANUAL HOOK PATCHES (from SukiSU source) ───
      - name: Apply SukiSU manual hook patches (for v3.0 non‑GKI)
        working-directory: ./kernel
        run: |
          # The SukiSU repo should contain a patchset or script to apply hooks.
          # Most common: a script that injects #include and callbacks.
          # We manually apply the hooks now.
          # (If SukiSU provides a script, we could use it. Otherwise we do it here.)

          echo "Applying manual hooks for kernel 4.4..."
          # Add KSU init calls to fs/exec.c (for non-GKI)
          # Example for exec.c: add #include "kernelsu_hook.h" and call ksu_handle_execveat
          # Because we can't know exact patch, we'll try to use the setup.sh from SukiSU if available,
          # otherwise fallback to known hooks.
          if [ -f /tmp/sukisu/kernel/setup.sh ]; then
            bash /tmp/sukisu/kernel/setup.sh v3.0
          else
            # Manual hook injection (simplified, must match v3.0)
            # Add #include "kernelsu_hook.h" to fs/exec.c, fs/open.c, etc.
            # and add hook calls. This is the minimum that KernelSU Next used.
            # For now, we'll rely on the setup.sh, which is the official method.
            echo "❌ setup.sh not found in SukiSU source"
            exit 1
          fi

          echo "✅ Manual hooks applied"
          # Verify that exec.c now mentions 'ksu_handle_execveat'
          if grep -q "ksu_handle_execveat" fs/exec.c; then
            echo "✅ exec.c patched with KSU hook"
          else
            echo "❌ exec.c does NOT contain KSU hook – something went wrong"
            exit 1
          fi

      # ─── STEP 5: KERNEL 4.4 COMPATIBILITY PATCHES (same as before, but verified) ───
      - name: Apply compatibility fixes for kernel 4.4
        working-directory: ./kernel
        run: |
          echo "=== Pre‑build compatibility fixes for 4.4 ==="

          # 1) Remove MODULE_IMPORT_NS macros
          grep -rIl 'MODULE_IMPORT_NS' drivers/kernelsu/ | while read f; do
            echo "Purging MODULE_IMPORT_NS from $f"
            sed -i '/MODULE_IMPORT_NS/d' "$f"
          done

          # 2) Stub compiler_types.h
          if ! grep -q 'compiler_types' include/linux/compiler_types.h 2>/dev/null; then
            echo '#include <linux/compiler.h>' > include/linux/compiler_types.h
            echo "Created stub for compiler_types.h"
          fi

          # 3) Replace missing headers
          find drivers/kernelsu/ -name '*.c' -o -name '*.h' | while read f; do
            sed -i 's|<linux/sched/task_stack.h>|<linux/sched.h>|g' "$f"
            sed -i 's|<linux/sched/task.h>|<linux/sched.h>|g' "$f"
          done

          # 4) full_name_hash → 2 args (4.4)
          find drivers/kernelsu/ -name '*.c' -o -name '*.h' | while read f; do
            sed -i 's/full_name_hash(NULL, \([^,]*\), strlen([^)]*))/full_name_hash((const unsigned char *)\1, strlen(\1))/g' "$f"
          done

          # 5) group_info->gid → GROUP_AT
          find drivers/kernelsu/ -name '*.c' -o -name '*.h' | while read f; do
            sed -i 's/group_info->gid\[\([^]]*\)\]/GROUP_AT(group_info, \1)/g' "$f"
          done

          # 6) security_add_hooks 2 args (4.4)
          find drivers/kernelsu/ -name '*.c' -o -name '*.h' | while read f; do
            sed -i 's/security_add_hooks(\([^,]*\), \([^,]*\), "[^"]*")/security_add_hooks(\1, \2)/g' "$f"
          done

          # 7) Stub SELinux internal functions (since they can't compile on 4.4)
          #    We replace whole selinux.c, sepolicy.c, rules.c with stubs.
          #    (same as your original code, but we check first)
          if [ -f drivers/kernelsu/selinux/selinux.c ]; then
            echo "Replacing selinux.c with 4.4 stub"
            cat > drivers/kernelsu/selinux/selinux.c << 'SEEOF'
          /* SukiSU selinux stubs for kernel 4.4 */
          #include <linux/kernel.h>
          int selinux_setenforce(int enforce) { return 0; }
          int selinux_getenforce(void) { return 1; }
          int is_ksu_domain(void) { return 0; }
          void setup_selinux(void) { }
          int handle_sepolicy(void) { return 0; }
          int path_umount(void *p, int f) { return -ENOSYS; }
          int ksu_get_devpts_sid(void) { return 0; }
          int apply_kernelsu_rules(void) { return 0; }
          long strncpy_from_user_nofault(char *d, const char __user *s, long n)
          { return strncpy_from_user(d, s, n); }
          SEEOF
          fi

          if [ -f drivers/kernelsu/selinux/sepolicy.c ]; then
            echo "Stubbing sepolicy.c"
            cat > drivers/kernelsu/selinux/sepolicy.c << 'SEPOL'
          /* SukiSU sepolicy stubs */
          #include <linux/kernel.h>
          int apply_sepolicy(const char *data, size_t size) { return 0; }
          int reset_sepolicy(void) { return 0; }
          int get_sepolicy(char **data, size_t *size) { return -ENOSYS; }
          int set_sepolicy(const char *data, size_t size) { return -ENOSYS; }
          SEPOL
          fi

          if [ -f drivers/kernelsu/selinux/rules.c ]; then
            echo "Stubbing rules.c"
            cat > drivers/kernelsu/selinux/rules.c << 'RULESEOF'
          /* SukiSU rules stubs */
          #include <linux/kernel.h>
          int ksu_init_rules(void) { return 0; }
          void ksu_exit_rules(void) { }
          int ksu_apply_rules(void) { return 0; }
          RULESEOF
          fi

          echo "✅ Compatibility fixes applied"
          # Quick check: no <linux/sched/task_stack.h> left
          if grep -rq '<linux/sched/task_stack.h>' drivers/kernelsu/; then
            echo "⚠️ Warning: task_stack.h still referenced somewhere"
          fi

      # ─── STEP 6: BUILD KERNEL WITH DEEP VERIFICATION ───
      - name: Build kernel and verify KSU integration
        working-directory: ./kernel
        run: |
          echo "=== Starting kernel build ==="
          make O=out ARCH=arm64 exynos7885-a20_defconfig
          make -j$(nproc) O=out ARCH=arm64 \
            CC=${CC} LD=${LD} AR=${AR} NM=${NM} \
            OBJCOPY=${OBJCOPY} OBJDUMP=${OBJDUMP} STRIP=${STRIP} \
            CROSS_COMPILE=${CROSS_COMPILE} 2>&1 | tee build.log

          # ─── VERIFICATION BLOCK ───
          echo ""
          echo "======================="
          echo "VERIFYING KSU BUILD"
          echo "======================="

          # 1) Check that .config contains CONFIG_KSU=y
          if grep -q "^CONFIG_KSU=y" out/.config; then
            echo "✅ 1/5: CONFIG_KSU=y is set in final .config"
          else
            echo "❌ 1/5: CONFIG_KSU=y NOT SET"
            exit 1
          fi

          # 2) Check that driver objects exist
          if [ -f out/drivers/kernelsu/ksu.o ] || [ -f out/drivers/kernelsu/built-in.o ]; then
            echo "✅ 2/5: KSU driver objects compiled"
          else
            echo "❌ 2/5: NO KSU object files found"
            exit 1
          fi

          # 3) Check that the kernel image is there
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ 3/5: Kernel Image missing"
            exit 1
          fi
          echo "✅ 3/5: Kernel Image exists"

          # 4) Verify Image contains KSU strings (e.g., "KernelSU")
          if strings out/arch/arm64/boot/Image | grep -q "KernelSU"; then
            echo "✅ 4/5: 'KernelSU' string found inside Image"
          else
            echo "❌ 4/5: 'KernelSU' string NOT found in Image – driver NOT linked"
            exit 1
          fi

          # 5) Verify the presence of the KSU initcall (checked by symbol)
          if aarch64-linux-gnu-nm out/arch/arm64/boot/Image | grep -q "ksu_init\|kernelsu_init"; then
            echo "✅ 5/5: KSU initcall symbol present in Image"
          else
            echo "❌ 5/5: KSU initcall symbol missing – driver may not run"
            exit 1
          fi

          echo "======================="
          echo "ALL VERIFICATIONS PASSED"
          echo "======================="
          # If we get here, the kernel has KSU built in
          cp out/arch/arm64/boot/Image .

      # ─── STEP 7: PACKAGE AND UPLOAD ───
      - name: Prepare AnyKernel3 package
        run: |
          cp -r kernel/kernel_zip/anykernel anykernel
          cp kernel/Image anykernel/

      - name: Inject custom anykernel.sh (if present)
        run: |
          if [ -f "anykernel3/anykernel.sh" ]; then
            cp anykernel3/anykernel.sh anykernel/
            echo "Custom anykernel.sh injected"
          fi

      - name: Create flashable ZIP
        run: |
          BUILD_NO=$(printf "%03d" ${{ github.run_number }})
          ZIP_NAME="sukisu-kernel-${BUILD_NO}"
          cd anykernel
          zip -r9 "../${ZIP_NAME}.zip" .
          cd ..
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload kernel to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.ZIP_NAME }}.zip
            kernel/build.log
          tag_name: sukisu-latest
          name: "SukiSU Verified Build #${{ github.run_number }}"
          body: "Kernel with verified SukiSU v3.0 driver (manual hooks). Build log attached."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
