name: Build Eureka R15 OneUI + KSU Next

on:
  workflow_dispatch:
    inputs:
      ksu_next_tag:
        description: 'KernelSU Next version tag (e.g. v1.1.1)'
        required: true
        default: 'v1.1.1'
      device:
        description: 'Device defconfig (exynos7885-a20_defconfig)'
        required: true
        default: 'exynos7885-a20_defconfig'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git make zip device-tree-compiler flex bison libssl-dev bc python3 zstd

      - name: Restore Neutron Clang from cache
        id: cache-neutron
        uses: actions/cache/restore@v4
        with:
          path: ~/neutron-clang
          key: neutron-clang-11032023

      - name: Download Neutron Clang (if cache miss)
        if: steps.cache-neutron.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/neutron-clang
          curl -L -o /tmp/neutron.tar.zst "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/11032023/neutron-clang-11032023.tar.zst"
          zstd -d /tmp/neutron.tar.zst -o /tmp/neutron.tar
          tar -xf /tmp/neutron.tar -C ~/neutron-clang
          rm -f /tmp/neutron.tar.zst /tmp/neutron.tar

      - name: Save Neutron Clang to cache
        if: steps.cache-neutron.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/neutron-clang
          key: neutron-clang-17-20250426

      - name: Set environment
        run: |
          echo "TC_PATH=$HOME/neutron-clang/bin" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$HOME/neutron-clang/bin/aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Clone Eureka Kernel R15-OneUI
        run: git clone --depth 1 https://github.com/eurekadevelopment/Eureka-Kernel -b R15-OneUI kernel_source

      - name: Integrate KSU Next (no submodule method)
        working-directory: kernel_source
        run: |
          rm -rf KernelSU .git/modules/KernelSU
          git config --remove-section submodule.KernelSU 2>/dev/null || true
          git config -f .gitmodules --remove-section submodule.KernelSU 2>/dev/null || true
          git rm --cached -rf KernelSU 2>/dev/null || true
          rm -f .git/index.lock
          git clone --depth 1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          cd KernelSU
          git fetch --tags --depth 1
          git checkout tags/${{ github.event.inputs.ksu_next_tag }} 2>/dev/null || git checkout ${{ github.event.inputs.ksu_next_tag }}
          cd ..
          bash KernelSU/kernel/setup.sh

      - name: Configure kernel
        working-directory: kernel_source
        run: |
          export PATH="$HOME/neutron-clang/bin:$PATH"
          make ${{ github.event.inputs.device }} 2>/dev/null || {
            echo "Defconfig not found. Available:"
            ls arch/arm64/configs/ | grep -iE "exynos|a20|7884|7885|7904"
            exit 1
          }
          if ! grep -q "CONFIG_KSU=y" .config; then
            echo "CONFIG_KSU=y" >> .config
          fi
          make olddefconfig

      - name: Build kernel
        working-directory: kernel_source
        run: |
          export PATH="$HOME/neutron-clang/bin:$PATH"
          make -j$(nproc) 2>&1 | tee build.log
          ls -la arch/arm64/boot/

      - name: Package with AnyKernel3
        run: |
          mkdir -p ak3_out/META-INF/com/google/android/ ak3_out/tools/
          TMP_AK3=$(mktemp -d)
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git "$TMP_AK3"
          cp "$TMP_AK3/META-INF/com/google/android/update-binary" ak3_out/META-INF/com/google/android/
          cp "$TMP_AK3/tools/ak3-core" ak3_out/tools/
          cp "$TMP_AK3/tools/magiskboot" ak3_out/tools/
          rm -rf "$TMP_AK3"
          cp anykernel3/anykernel.sh ak3_out/
          if [ -f kernel_source/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel_source/arch/arm64/boot/Image.gz-dtb ak3_out/
          elif [ -f kernel_source/arch/arm64/boot/Image.gz ]; then
            cp kernel_source/arch/arm64/boot/Image.gz ak3_out/
          elif [ -f kernel_source/arch/arm64/boot/Image ]; then
            cp kernel_source/arch/arm64/boot/Image ak3_out/
          else
            echo "No kernel image found!"
            exit 1
          fi
          ZIP_NAME="Eureka-R15-OneUI-KSU-Next-${{ github.event.inputs.ksu_next_tag }}-${{ github.event.inputs.device }}.zip"
          cd ak3_out && zip -r9 "../$ZIP_NAME" ./* && cd ..
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel_source/build.log
