name: Build Eureka R15 OneUI + KSU Next

on:
  workflow_dispatch:
    inputs:
      ksu_tag:
        description: 'KernelSU Next version tag'
        type: choice
        required: true
        default: 'v1.1.1'
        options:
          # ── v3.x (latest) ──
          - 'v3.2.0'
          - 'v3.1.0'
          - 'v3.0.1'
          - 'v3.0.0'
          # ── v3.x legacy ──
          - 'v3.2.0-legacy'
          - 'v3.1.0-legacy'
          - 'v3.0.1-legacy'
          - 'v3.0.0-legacy'
          # ── v1.x ──
          - 'v1.1.1'
          - 'v1.1.0'
          - 'v1.0.9'
          - 'v1.0.8'
          - 'v1.0.7'
          - 'v1.0.6'
          - 'v1.0.5'
          - 'v1.0.4'
          - 'v1.0.3'
          - 'v1.0.2'
          - 'v1.0.1'
          - 'v1.0.0'
      device:
        description: 'Device defconfig'
        required: true
        default: 'exynos7885-a20_defconfig'
        type: choice
        options:
          - exynos7885-a20_defconfig
          - exynos7885-a20e_defconfig
          - exynos7885-a10_defconfig
          - exynos7885-a30_defconfig
          - exynos7885-a30s_defconfig
          - exynos7885-a40_defconfig
          - exynos7885-a7y18lte_defconfig
          - exynos7885-a8y18lte_defconfig

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repo (for anykernel.sh)
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make git python3 cpio gcc-aarch64-linux-gnu

      - name: Setup Neutron Clang via antman
        run: |
          mkdir -p toolchain
          cd toolchain
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S=10032024
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") --patch=glibc
          cd ..
          echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH

      - name: Set LLVM environment
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV

      - name: Clone Eureka Kernel R15-OneUI
        run: |
          rm -rf kernel
          git clone --depth 1 https://github.com/eurekadevelopment/Eureka-Kernel.git -b R15-OneUI kernel
          cd kernel
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Purge old KernelSU submodule
        working-directory: ./kernel
        run: |
          if [ -e "KernelSU" ]; then
            git rm -rf KernelSU 2>/dev/null || rm -rf KernelSU
          fi
          if [ -f ".gitmodules" ] && grep -q 'submodule "KernelSU"' .gitmodules 2>/dev/null; then
            git config --file .gitmodules --remove-section submodule.KernelSU 2>/dev/null || true
            git add .gitmodules
          fi
          rm -rf .git/modules/KernelSU 2>/dev/null || true
          git add -A
          git commit -m "Purge KernelSU before adding KSU Next" || echo "No changes to commit"

      - name: Clone KernelSU Next (selected tag)
        run: |
          TAG="${{ github.event.inputs.ksu_tag }}"
          echo "Using KernelSU Next tag: $TAG"
          rm -rf KernelSU-Next
          git clone --depth 1 --branch "$TAG" \
            https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next || {
              echo "ERROR: Failed to clone tag $TAG"
              exit 1
            }

      - name: Run KernelSU Next setup
        run: |
          cd kernel
          bash ../KernelSU-Next/kernel/setup.sh ${{ github.event.inputs.ksu_tag }}

      - name: Patch defconfig for KernelSU
        working-directory: ./kernel
        run: |
          DEFCONFIG="arch/arm64/configs/${{ github.event.inputs.device }}"
          echo "CONFIG_KALLSYMS=y" >> "$DEFCONFIG"
          echo "CONFIG_KALLSYMS_ALL=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG"
          echo "# CONFIG_KPROBES is not set" >> "$DEFCONFIG"
          echo "# CONFIG_HAVE_KPROBES is not set" >> "$DEFCONFIG"
          echo "# CONFIG_KPROBES_EVENTS is not set" >> "$DEFCONFIG"
          echo "# CONFIG_LTO_CLANG is not set" >> "$DEFCONFIG"
          echo "CONFIG_SIPHASH=y" >> "$DEFCONFIG"
          echo "=== Last 12 lines of $DEFCONFIG ==="
          tail -12 "$DEFCONFIG"

      - name: Configure kernel
        working-directory: ./kernel
        run: |
          make O=out ARCH=arm64 ${{ github.event.inputs.device }}

      - name: Debug – show KSU config
        working-directory: ./kernel
        run: |
          echo "=== Does .config exist? ==="
          test -f out/.config && echo "YES" || echo "NO"
          echo "=== Lines containing KSU ==="
          grep -i ksu out/.config || echo "No KSU lines found"
          
      - name: Verify KSU in config
        run: |
          grep -q "CONFIG_KSU=y" "${{ github.workspace }}/kernel/out/.config" || { echo "ERROR: KernelSU not enabled!"; exit 1; }
          echo "KernelSU config verified OK"

      - name: Build kernel
        working-directory: ./kernel
        run: |
          make -j$(nproc) O=out ARCH=arm64 \
            CC=${CC} LD=${LD} AR=${AR} NM=${NM} \
            OBJCOPY=${OBJCOPY} OBJDUMP=${OBJDUMP} STRIP=${STRIP} \
            CROSS_COMPILE=${CROSS_COMPILE} 2>&1 | tee build.log

      - name: Check build output
        working-directory: ./kernel
        run: |
          echo "=== Build output ==="
          ls -la out/arch/arm64/boot/
          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ] && [ ! -f out/arch/arm64/boot/Image.gz ] && [ ! -f out/arch/arm64/boot/Image ]; then
            echo "ERROR: No kernel image produced!"
            exit 1
          fi

      # ─── Setup AnyKernel3 (from kernel source) ───
      - name: Setup AnyKernel3
        run: |
          cp -r kernel/kernel_zip/anykernel anykernel

      # ─── Copy the built kernel image ───
      - name: Copy kernel image to AnyKernel3
        run: |
          cp kernel/out/arch/arm64/boot/Image anykernel/ || \
          cp kernel/out/arch/arm64/boot/Image.gz anykernel/ || \
          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/

      # (Optional) Overwrite anykernel.sh with your custom version
      - name: Inject custom anykernel.sh
        run: |
          if [ -f "anykernel3/anykernel.sh" ]; then
            cp anykernel3/anykernel.sh anykernel/
            echo "Custom anykernel.sh injected"
          else
            echo "Using default anykernel.sh from kernel source"
          fi

      # ─── Create the flashable ZIP ───
      - name: Create flashable ZIP
        run: |
          BUILD_NO=$(printf "%03d" ${{ github.run_number }})
          ZIP_NAME="skewkernel-${BUILD_NO}"
          cd anykernel
          zip -r9 "../${ZIP_NAME}.zip" .
          cd ..
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      # ─── Upload the ZIP ───
      - name: Upload kernel ZIP to release
        uses: softprops/action-gh-release@v1
        with:
          files: skewkernel-${{ env.BUILD_NO }}.zip
          tag_name: latest
          name: "Build #${{ github.run_number }}"
          body: "Automated build from ${{ github.ref }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.event.inputs.device }}
          path: kernel/build.log
