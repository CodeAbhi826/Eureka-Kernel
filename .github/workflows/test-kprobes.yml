name: Kprobe Diagnostic Test

on:
  push:
    branches: [ "R15-OneUI" ]
    paths:
      - '.github/workflows/test-kprobes.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Eureka Kernel source
        uses: actions/checkout@v4
        with:
          repository: eurekadevelopment/Eureka-Kernel
          ref: R15-OneUI
          path: kernel

      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y bc bison flex libssl-dev make git python3 cpio gcc-aarch64-linux-gnu

      - name: Neutron Clang
        run: |
          mkdir -p toolchain && cd toolchain
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S=10032024
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") --patch=glibc
          cd ..
          echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH

      - name: Enable kprobes and required configs
        working-directory: ./kernel
        run: |
          D="arch/arm64/configs/exynos7885-a20_defconfig"
          echo "Enabling kprobe‑related configs..."
          for c in \
            CONFIG_KPROBES=y \
            CONFIG_HAVE_KPROBES=y \
            CONFIG_KPROBE_EVENTS=y \
            CONFIG_KALLSYMS=y \
            CONFIG_KALLSYMS_ALL=y \
            CONFIG_KSU=y \
            CONFIG_KSU_KPROBE_HOOKS=y \
            CONFIG_DYNAMIC_FTRACE=y \
            CONFIG_FTRACE_SYSCALLS=y \
            CONFIG_HAVE_SYSCALL_TRACEPOINTS=y; do
            grep -q "^$c" "$D" || echo "$c" >> "$D"
          done
          sed -i 's/^CONFIG_LTO=y/# CONFIG_LTO is not set/' "$D"

      - name: Show kprobe‑related configs after patching
        working-directory: ./kernel
        run: |
          echo "=== Relevant configs ==="
          grep -E "KPROBE|FTRACE|TRACEPOINT|KALLSYMS|KSU|LTO" arch/arm64/configs/exynos7885-a20_defconfig

      - name: Integrate KSU Next (kprobe mode) + Kbuild + backport
        working-directory: ./kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          # In-tree Kbuild
          cat > drivers/kernelsu/Kbuild << 'KBUILDEOF'
          kernelsu-objs := ksu.o
          kernelsu-objs += allowlist.o
          kernelsu-objs += app_profile.o
          kernelsu-objs += apk_sign.o
          kernelsu-objs += sucompat.o
          kernelsu-objs += syscall_hook_manager.o
          kernelsu-objs += throne_tracker.o
          kernelsu-objs += pkg_observer.o
          kernelsu-objs += setuid_hook.o
          kernelsu-objs += lsm_hooks.o
          kernelsu-objs += kernel_compat.o
          kernelsu-objs += kernel_umount.o
          kernelsu-objs += supercalls.o
          kernelsu-objs += su_mount_ns.o
          kernelsu-objs += feature.o
          kernelsu-objs += ksud.o
          kernelsu-objs += seccomp_cache.o
          kernelsu-objs += file_wrapper.o
          kernelsu-objs += util.o
          kernelsu-objs += extras.o
          kernelsu-objs += selinux/selinux.o
          kernelsu-objs += selinux/sepolicy.o
          kernelsu-objs += selinux/rules.o
          obj-$(CONFIG_KSU) += kernelsu.o
          KBUILDEOF
          rm -f drivers/kernelsu/Makefile
          echo "ccflags-y += -Wno-strict-prototypes" >> drivers/kernelsu/Kbuild
          
          # Backport kvmalloc/kvfree
          cat > drivers/kernelsu/compat_backport.c << 'BACKPORTEOF'
          #include <linux/mm.h>
          #include <linux/vmalloc.h>
          #include <linux/slab.h>
          void *kvmalloc(size_t size, gfp_t flags) {
              void *ret;
              if (size <= PAGE_SIZE) ret = kmalloc(size, flags | __GFP_NOWARN);
              else ret = vmalloc(size);
              if (!ret && (size > PAGE_SIZE || !(flags & __GFP_NOWARN))) ret = vmalloc(size);
              return ret;
          }
          void kvfree(const void *addr) {
              if (is_vmalloc_addr(addr)) vfree(addr);
              else kfree(addr);
          }
          BACKPORTEOF
          
          # Append backport, suppress warnings, and set a proper version
          echo "obj-y += compat_backport.o" >> drivers/kernelsu/Kbuild
          echo "ccflags-y += -Wno-strict-prototypes" >> drivers/kernelsu/Kbuild
          echo "ccflags-y += -Wno-incompatible-pointer-types-discards-qualifiers" >> drivers/kernelsu/Kbuild
          echo 'ccflags-y += -DKSU_VERSION=30000' >> drivers/kernelsu/Kbuild
          echo 'ccflags-y += -DKSU_VERSION_TAG=\"v3.1.0-legacy\"' >> drivers/kernelsu/Kbuild

      - name: Build kernel
        working-directory: ./kernel
        run: |
          export PATH="$(pwd)/../toolchain/bin:$PATH"
          make O=out ARCH=arm64 exynos7885-a20_defconfig 2>&1 | tail -5
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- 2>&1 | tee build.log

      - name: Run diagnostics
        working-directory: ./kernel
        run: |
          echo ""
          echo "╔══════════════════════════════════════╗"
          echo "║   KPROBE DIAGNOSTIC REPORT           ║"
          echo "╚══════════════════════════════════════╝"
          echo ""

          # 1) Required kernel configs
          echo "─── 1. Required kernel configs ───"
          for cfg in \
            CONFIG_KPROBES=y \
            CONFIG_HAVE_KPROBES=y \
            CONFIG_KPROBE_EVENTS=y \
            CONFIG_KALLSYMS=y \
            CONFIG_KALLSYMS_ALL=y \
            CONFIG_KSU=y \
            CONFIG_KSU_KPROBE_HOOKS=y \
            CONFIG_HAVE_SYSCALL_TRACEPOINTS=y \
            CONFIG_DYNAMIC_FTRACE=y \
            CONFIG_FTRACE_SYSCALLS=y; do
            if grep -q "^$cfg" out/.config; then
              echo "  ✅ $cfg"
            else
              echo "  ❌ $cfg MISSING"
            fi
          done

          # 2) KSU driver objects
          echo ""
          echo "─── 2. KSU driver objects ───"
          if ls out/drivers/kernelsu/ksu.o &>/dev/null || ls out/drivers/kernelsu/built-in.o &>/dev/null; then
            echo "  ✅ Driver compiled"
          else
            echo "  ❌ Driver objects NOT FOUND"
          fi

          # 3) KernelSU string in Image
          echo ""
          echo "─── 3. KernelSU in Image ───"
          if [ -f out/arch/arm64/boot/Image ] && strings out/arch/arm64/boot/Image | grep -q "KernelSU"; then
            echo "  ✅ KernelSU string present – kprobes likely WORKING"
          else
            echo "  ❌ KernelSU string MISSING – kprobes compatibility FAILED"
          fi

          # 4) KSU symbols in vmlinux (if available)
          echo ""
          echo "─── 4. KSU symbols in vmlinux ───"
          if [ -f out/vmlinux ]; then
            echo "KSU-related symbols:"
            aarch64-linux-gnu-nm out/vmlinux 2>/dev/null | grep -i "ksu_" | head -20
          else
            echo "  vmlinux not found"
          fi

          # 5) kprobe-specific symbols
          echo ""
          echo "─── 5. Kprobe-specific symbols ───"
          if [ -f out/vmlinux ]; then
            echo "Looking for kprobe infrastructure..."
            aarch64-linux-gnu-nm out/vmlinux 2>/dev/null | grep -E "register_kprobe|ksu_kprobe" | head -10
          fi

          # 6) FTRACE / SYSCALL_TRACEPOINT check
          echo ""
          echo "─── 6. FTRACE/SYSCALL_TRACEPOINT symbols ───"
          if [ -f out/vmlinux ]; then
            aarch64-linux-gnu-nm out/vmlinux 2>/dev/null | grep -i "tracepoint" | head -5
          fi

          echo ""
          echo "══════════════════════════════════════"
          echo " VERDICT"
          echo "══════════════════════════════════════"
          if [ -f out/arch/arm64/boot/Image ] && strings out/arch/arm64/boot/Image | grep -q "KernelSU"; then
            echo "✅ KSU Next with kprobes – SUCCESS"
            echo "   You can switch to kprobe mode for simpler updates."
          else
            echo "❌ KSU Next with kprobes – FAILED"
            echo "   Reason: kprobes are broken / missing syscall tracepoints."
            echo "   Stick with manual hooks – they are already working."
          fi
