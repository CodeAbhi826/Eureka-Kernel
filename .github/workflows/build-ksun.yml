name: Build KSU Next Legacy

on:
  push:
    branches: [ "R15-OneUI" ]
    paths:
      - '.github/workflows/build-ksun.yml'
  workflow_dispatch:
    inputs:
      ksu_version:
        description: 'KernelSU Next version (legacy)'
        type: choice
        required: true
        default: 'v3.1.0-legacy'
        options:
          - 'v3.1.0-legacy'
          - 'v3.1.0-legacy-susfs'
          - 'v3.0.1-legacy'
          - 'v3.0.0'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: "[0/8] Checkout Eureka Kernel source"
        uses: actions/checkout@v4
        with:
          repository: eurekadevelopment/Eureka-Kernel
          ref: R15-OneUI
          path: kernel

      - name: "Verify checkout"
        run: |
          [ -f kernel/Makefile ] || { echo "FAIL"; exit 1; }
          echo "OK"

      - name: "[1/8] Install dependencies"
        run: |
          sudo apt update -qq
          sudo apt install -y bc bison flex libssl-dev make git python3 cpio gcc-aarch64-linux-gnu
          # Enable universe repo (required for coccinelle on Ubuntu 24.04)
          sudo add-apt-repository -y universe
          sudo apt update -qq
          sudo apt install -y coccinelle
          # Verify spatch (the Coccinelle binary) is available
          command -v spatch || { echo "spatch not found"; exit 1; }

      - name: "Verify deps"
        run: |
          for tool in bc bison flex make git python3 spatch aarch64-linux-gnu-gcc; do
            command -v $tool || { echo "MISSING: $tool"; exit 1; }
          done
          echo "OK"

      - name: "[2/8] Neutron Clang toolchain"
        run: |
          mkdir -p toolchain && cd toolchain
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S=10032024
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") --patch=glibc
          cd ..
          echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH

      - name: "Verify toolchain"
        run: |
          export PATH="$(pwd)/toolchain/bin:$PATH"
          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            command -v $tool || { echo "MISSING: $tool"; exit 1; }
          done
          echo "OK"

      - name: "[3/8] Set env vars"
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV

      - name: "Verify env"
        run: |
          [ "$ARCH" = "arm64" ] || { echo "BAD ARCH"; exit 1; }
          echo "OK"

      - name: "[4/8] Patch defconfig"
        working-directory: ./kernel
        run: |
          D="arch/arm64/configs/exynos7885-a20_defconfig"
          grep -q "CONFIG_KALLSYMS=y" "$D" || echo "CONFIG_KALLSYMS=y" >> "$D"
          grep -q "CONFIG_KALLSYMS_ALL=y" "$D" || echo "CONFIG_KALLSYMS_ALL=y" >> "$D"
          grep -q "CONFIG_KSU=y" "$D" || echo "CONFIG_KSU=y" >> "$D"
          sed -i 's/^CONFIG_KPROBES=y/# CONFIG_KPROBES is not set/' "$D"
          sed -i 's/^CONFIG_KRETPROBES=y/# CONFIG_KRETPROBES is not set/' "$D"
          sed -i 's/^CONFIG_LTO=y/# CONFIG_LTO is not set/' "$D"
          grep -q "CONFIG_SIPHASH=y" "$D" || echo "CONFIG_SIPHASH=y" >> "$D"
          for s in CONFIG_KSU=y CONFIG_KALLSYMS=y CONFIG_KALLSYMS_ALL=y CONFIG_SIPHASH=y; do
            grep -q "^$s" "$D" || { echo "MISSING: $s"; exit 1; }
          done
          echo "OK"

      - name: "[5/8] Integrate KSU Next driver + precise hooks"
        working-directory: ./kernel
        run: |
          V="${{ github.event.inputs.ksu_version }}"
          V="${V:-v3.1.0-legacy}"
          echo "Using KSU version: $V"
          rm -rf drivers/kernelsu KernelSU-Next

          # Download driver
          curl -L "https://github.com/KernelSU-Next/KernelSU-Next/archive/refs/tags/${V}.tar.gz" -o /tmp/ksu.tar.gz
          mkdir -p /tmp/ksu-src
          tar xzf /tmp/ksu.tar.gz -C /tmp/ksu-src --strip-components=1
          cp -r /tmp/ksu-src/kernel drivers/kernelsu

          # Run official setup.sh (handles Makefile/Kconfig, possibly backports)
          if [ -f /tmp/ksu-src/kernel/setup.sh ]; then
            cp /tmp/ksu-src/kernel/setup.sh /tmp/ksu-setup.sh
            chmod +x /tmp/ksu-setup.sh
            /tmp/ksu-setup.sh legacy || echo "setup.sh returned non-zero, continuing..."
          fi

          # Ensure hook header is accessible (symlink or copy to include/linux)
          if [ -f drivers/kernelsu/kernelsu_hook.h ]; then
            ln -sf "$(pwd)/drivers/kernelsu/kernelsu_hook.h" include/linux/kernelsu_hook.h
            echo "Symlinked kernelsu_hook.h to include/linux/"
          else
            echo "⚠️ kernelsu_hook.h not found in driver"
          fi

          # Inject hooks that exactly match the Eureka kernel's syscall signatures
          echo "Injecting hooks using precise sed patterns..."

          # Helpers
          hook_after_brace() {
            # Usage: hook_after_brace <file> <search_pattern> <hook_code>
            # Finds the line matching <search_pattern>, then appends <hook_code>
            # after the next line that begins with '{'
            sed -i "/$2/,/^{/{
              /^{/a\\
$3
            }" "$1"
          }
          ensure_header() {
            local file="$1"
            if ! grep -q 'kernelsu_hook.h' "$file"; then
              sed -i '1i #include <linux/kernelsu_hook.h>' "$file"
            fi
          }

          # fs/exec.c → execveat (line 2159)
          ensure_header fs/exec.c
          hook_after_brace fs/exec.c 'SYSCALL_DEFINE5(execveat,' \
            'if (ksu_handle_execveat(filename, \&argv, \&envp, flags)) return -EPERM;'

          # fs/open.c → open (line 1149: SYSCALL_DEFINE3(open, const char __user *, filename, int, flags, umode_t, mode))
          ensure_header fs/open.c
          hook_after_brace fs/open.c 'SYSCALL_DEFINE3(open,' \
            'if (ksu_handle_open(\&filename, flags, mode)) return -EPERM;'

          # fs/read_write.c → read (line 580)
          ensure_header fs/read_write.c
          hook_after_brace fs/read_write.c 'SYSCALL_DEFINE3(read,' \
            'if (ksu_handle_read(fd, buf, count)) return -EPERM;'

          # fs/stat.c → newstat (line 271)
          ensure_header fs/stat.c
          hook_after_brace fs/stat.c 'SYSCALL_DEFINE2(newstat,' \
            'if (ksu_handle_stat(filename, statbuf)) return -EPERM;'

          # kernel/fork.c → clone (line 2135, first occurrence)
          ensure_header kernel/fork.c
          hook_after_brace kernel/fork.c 'SYSCALL_DEFINE5(clone, unsigned long, clone_flags, unsigned long, newsp,' \
            'if (ksu_handle_clone(clone_flags, newsp, parent_tidptr, child_tidptr, tls)) return -EPERM;'

          # Verify hooks
          echo "Verifying hooks..."
          for check in \
            'fs/exec.c:ksu_handle_execveat' \
            'fs/open.c:ksu_handle_open' \
            'fs/read_write.c:ksu_handle_read' \
            'fs/stat.c:ksu_handle_stat' \
            'kernel/fork.c:ksu_handle_clone'; do
            f="${check%%:*}"
            s="${check##*:}"
            if grep -q "$s" "$f"; then
              echo "  ✅ $f: $s"
            else
              echo "  ❌ $f: $s MISSING"
              exit 1
            fi
          done

          echo "✅ All hooks injected successfully"

      - name: "[7/8] Cleanup"
        working-directory: ./kernel
        run: |
          grep -rIl 'MODULE_IMPORT_NS' drivers/kernelsu/ 2>/dev/null | while read f; do sed -i '/MODULE_IMPORT_NS/d' "$f"; done
          [ -f include/linux/compiler_types.h ] || echo '#include <linux/compiler.h>' > include/linux/compiler_types.h
          echo "OK"

      - name: "🔍 Diagnostic: Show syscall definitions"
        working-directory: ./kernel
        run: |
          echo "=== exec.c execveat definition ==="
          grep -n "SYSCALL_DEFINE.*execveat" fs/exec.c || echo "NOT FOUND"
          echo ""
          echo "=== open.c open definition ==="
          grep -n "SYSCALL_DEFINE.*open" fs/open.c || echo "NOT FOUND"
          echo ""
          echo "=== read_write.c read definition ==="
          grep -n "SYSCALL_DEFINE.*read" fs/read_write.c || echo "NOT FOUND"
          echo ""
          echo "=== stat.c newstat definition ==="
          grep -n "SYSCALL_DEFINE.*newstat" fs/stat.c || echo "NOT FOUND"
          echo ""
          echo "=== fork.c clone definition ==="
          grep -n "SYSCALL_DEFINE.*clone" kernel/fork.c || echo "NOT FOUND"
      
      - name: "[8/8] Build kernel"
        working-directory: ./kernel
        run: |
          make O=out ARCH=arm64 exynos7885-a20_defconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- 2>&1 | tee build.log

      - name: "Final verify"
        working-directory: ./kernel
        run: |
          grep -q "^CONFIG_KSU=y" out/.config || { echo "FAIL1"; exit 1; }
          [ -f out/drivers/kernelsu/ksu.o ] || [ -f out/drivers/kernelsu/built-in.o ] || { echo "FAIL2"; exit 1; }
          [ -f out/arch/arm64/boot/Image ] || { echo "FAIL3"; exit 1; }
          strings out/arch/arm64/boot/Image | grep -q "KernelSU" || { echo "FAIL4"; exit 1; }
          cp out/arch/arm64/boot/Image .
          echo "ALL OK"

      - name: "📦 Create flashable ZIP"
        id: zip
        run: |
          VERSION="${{ github.event.inputs.ksu_version }}"
          VERSION="${VERSION:-v3.1.0-legacy}"
          BUILD_NO=$(printf "%03d" ${{ github.run_number }})
          ZIP_NAME="ksu-next-${VERSION}-a20-${BUILD_NO}"
          cd anykernel
          zip -r9 "../${ZIP_NAME}.zip" .
          cd ..
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: "Upload"
        uses: actions/upload-artifact@v4
        with:
          name: ksu-${{ github.run_number }}
          path: |
            ksu.zip
            kernel/build.log
