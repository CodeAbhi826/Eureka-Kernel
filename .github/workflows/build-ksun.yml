name: Build KSU Next Legacy

on:
  push:
    branches: [ "R15-OneUI" ]
    paths:
      - '.github/workflows/build-ksun.yml'
  workflow_dispatch:
    inputs:
      ksu_version:
        description: 'KernelSU Next version (legacy)'
        type: choice
        required: true
        default: 'v3.1.0-legacy'
        options:
          - 'v3.1.0-legacy'
          - 'v3.1.0-legacy-susfs'
          - 'v3.0.1-legacy'
          - 'v3.0.0'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: "[0/8] Checkout Eureka Kernel source"
        uses: actions/checkout@v4
        with:
          repository: eurekadevelopment/Eureka-Kernel
          ref: R15-OneUI
          path: kernel

      - name: "Verify checkout"
        run: |
          [ -f kernel/Makefile ] || { echo "FAIL"; exit 1; }
          echo "OK"

      - name: "[1/8] Install dependencies"
        run: |
          sudo apt update -qq
          sudo apt install -y bc bison flex libssl-dev make git python3 cpio gcc-aarch64-linux-gnu
          # Enable universe repo (required for coccinelle on Ubuntu 24.04)
          sudo add-apt-repository -y universe
          sudo apt update -qq
          sudo apt install -y coccinelle
          # Verify spatch (the Coccinelle binary) is available
          command -v spatch || { echo "spatch not found"; exit 1; }

      - name: "Verify deps"
        run: |
          for tool in bc bison flex make git python3 spatch aarch64-linux-gnu-gcc; do
            command -v $tool || { echo "MISSING: $tool"; exit 1; }
          done
          echo "OK"

      - name: "[2/8] Neutron Clang toolchain"
        run: |
          mkdir -p toolchain && cd toolchain
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S=10032024
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") --patch=glibc
          cd ..
          echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH

      - name: "Verify toolchain"
        run: |
          export PATH="$(pwd)/toolchain/bin:$PATH"
          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            command -v $tool || { echo "MISSING: $tool"; exit 1; }
          done
          echo "OK"

      - name: "[3/8] Set env vars"
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV

      - name: "Verify env"
        run: |
          [ "$ARCH" = "arm64" ] || { echo "BAD ARCH"; exit 1; }
          echo "OK"

      - name: "[4/8] Patch defconfig"
        working-directory: ./kernel
        run: |
          D="arch/arm64/configs/exynos7885-a20_defconfig"
          grep -q "CONFIG_KALLSYMS=y" "$D" || echo "CONFIG_KALLSYMS=y" >> "$D"
          grep -q "CONFIG_KALLSYMS_ALL=y" "$D" || echo "CONFIG_KALLSYMS_ALL=y" >> "$D"
          grep -q "CONFIG_KSU=y" "$D" || echo "CONFIG_KSU=y" >> "$D"
          sed -i 's/^CONFIG_KPROBES=y/# CONFIG_KPROBES is not set/' "$D"
          sed -i 's/^CONFIG_KRETPROBES=y/# CONFIG_KRETPROBES is not set/' "$D"
          sed -i 's/^CONFIG_LTO=y/# CONFIG_LTO is not set/' "$D"
          grep -q "CONFIG_SIPHASH=y" "$D" || echo "CONFIG_SIPHASH=y" >> "$D"
          for s in CONFIG_KSU=y CONFIG_KALLSYMS=y CONFIG_KALLSYMS_ALL=y CONFIG_SIPHASH=y; do
            grep -q "^$s" "$D" || { echo "MISSING: $s"; exit 1; }
          done
          echo "OK"
          # Allow dmesg without root (debug KSU)
          grep -q "CONFIG_SECURITY_DMESG_RESTRICT" "$D" && sed -i 's/^CONFIG_SECURITY_DMESG_RESTRICT=y/# CONFIG_SECURITY_DMESG_RESTRICT is not set/' "$D" || echo "# CONFIG_SECURITY_DMESG_RESTRICT is not set" >> "$D"
          # Enable KSU internal debug prints
          grep -q "CONFIG_KSU_DEBUG=y" "$D" || echo "CONFIG_KSU_DEBUG=y" >> "$D"
                    
      - name: "[5/8] Clean old hooks + integrate KSU Next (official manual method)"
        working-directory: ./kernel
        run: |
          V="${{ github.event.inputs.ksu_version }}"
          V="${V:-v3.1.0-legacy}"
          echo "Using KSU version: $V"
          rm -rf drivers/kernelsu KernelSU-Next

          # Download driver
          curl -L "https://github.com/KernelSU-Next/KernelSU-Next/archive/refs/tags/${V}.tar.gz" -o /tmp/ksu.tar.gz
          mkdir -p /tmp/ksu-src
          tar xzf /tmp/ksu.tar.gz -C /tmp/ksu-src --strip-components=1
          cp -r /tmp/ksu-src/kernel drivers/kernelsu

          # Run official setup.sh (patches drivers/Makefile, Kconfig, selinux backports, etc.)
          if [ -f /tmp/ksu-src/kernel/setup.sh ]; then
            cp /tmp/ksu-src/kernel/setup.sh /tmp/ksu-setup.sh
            chmod +x /tmp/ksu-setup.sh
            /tmp/ksu-setup.sh legacy || echo "setup.sh returned non-zero, continuing..."
          fi

          # In‑tree Kbuild
          cat > drivers/kernelsu/Kbuild << 'KBUILDEOF'
          kernelsu-objs := ksu.o
          kernelsu-objs += allowlist.o
          kernelsu-objs += app_profile.o
          kernelsu-objs += apk_sign.o
          kernelsu-objs += sucompat.o
          kernelsu-objs += syscall_hook_manager.o
          kernelsu-objs += throne_tracker.o
          kernelsu-objs += pkg_observer.o
          kernelsu-objs += setuid_hook.o
          kernelsu-objs += lsm_hooks.o
          kernelsu-objs += kernel_compat.o
          kernelsu-objs += kernel_umount.o
          kernelsu-objs += supercalls.o
          kernelsu-objs += su_mount_ns.o
          kernelsu-objs += feature.o
          kernelsu-objs += ksud.o
          kernelsu-objs += seccomp_cache.o
          kernelsu-objs += file_wrapper.o
          kernelsu-objs += util.o
          kernelsu-objs += extras.o
          kernelsu-objs += selinux/selinux.o
          kernelsu-objs += selinux/sepolicy.o
          kernelsu-objs += selinux/rules.o
          obj-$(CONFIG_KSU) += kernelsu.o
          KBUILDEOF
          rm -f drivers/kernelsu/Makefile

          # Backport kvmalloc/kvfree
          cat > drivers/kernelsu/compat_backport.c << 'BACKPORTEOF'
          #include <linux/mm.h>
          #include <linux/vmalloc.h>
          #include <linux/slab.h>
          void *kvmalloc(size_t size, gfp_t flags) {
              void *ret;
              if (size <= PAGE_SIZE) ret = kmalloc(size, flags | __GFP_NOWARN);
              else ret = vmalloc(size);
              if (!ret && (size > PAGE_SIZE || !(flags & __GFP_NOWARN))) ret = vmalloc(size);
              return ret;
          }
          void kvfree(const void *addr) {
              if (is_vmalloc_addr(addr)) vfree(addr);
              else kfree(addr);
          }
          BACKPORTEOF
          echo "obj-y += compat_backport.o" >> drivers/kernelsu/Kbuild

          # Cleanup
          grep -rIl 'MODULE_IMPORT_NS' drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i '/MODULE_IMPORT_NS/d' "$f"
          done
          [ -f include/linux/compiler_types.h ] || echo '#include <linux/compiler.h>' > include/linux/compiler_types.h

          # ── Remove ALL previous hook injections (ours and old KSU) ──
          echo "Cleaning all previous hooks..."
          for f in fs/exec.c fs/open.c fs/read_write.c fs/stat.c kernel/reboot.c drivers/input/input.c; do
            # Remove lines referencing kernelsu_hook.h
            sed -i '/kernelsu_hook.h/d' "$f" 2>/dev/null || true
            # Remove lines with ksu_handle_ calls
            sed -i '/ksu_handle_/d' "$f" 2>/dev/null || true
            # Remove old extern declarations for KSU
            sed -i '/^extern.*ksu_/d' "$f" 2>/dev/null || true
            # Remove old #ifdef CONFIG_KSU / #endif blocks (single-line only)
            sed -i '/#ifdef CONFIG_KSU/d' "$f" 2>/dev/null || true
            sed -i '/#endif.*CONFIG_KSU/d' "$f" 2>/dev/null || true
          done
          echo "All previous hooks cleaned"

          # ── Apply official KSU Next manual hooks ──
          echo "Applying official KSU Next hooks..."

          # 1) fs/exec.c → do_execve (add before return do_execveat_common)
          sed -i '/^int do_execve(struct filename \*filename,$/{
            N;N;N;N;N
            /return do_execveat_common/{ 
              i\
          #ifdef CONFIG_KSU\
          \tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\
          #endif
                      }
                    }' fs/exec.c
                    echo "Patched fs/exec.c (do_execve)"
          
                    # 2) fs/open.c → faccessat (add after lookup_flags init)
                    sed -i '/unsigned int lookup_flags = LOOKUP_FOLLOW;/a\
          #ifdef CONFIG_KSU\
          \tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\
          #endif' fs/open.c
                    echo "Patched fs/open.c (faccessat)"
          
                    # 3) fs/read_write.c → SYSCALL_DEFINE3(read...)
                    sed -i '/SYSCALL_DEFINE3(read, unsigned int, fd, char __user \*, buf, size_t, count)/{
                      /struct fd f = fdget_pos/{
                        i\
          #ifdef CONFIG_KSU\
          \tif (unlikely(ksu_vfs_read_hook))\
          \t\tksu_handle_sys_read(fd, &buf, &count);\
          #endif
                      }
                    }' fs/read_write.c
                    echo "Patched fs/read_write.c (read)"
          
                    # 4) fs/stat.c → newfstatat (add after kstat stat; int error;)
                    sed -i '/struct kstat stat;/{
                      N
                      /int error;/{
                        a\
          #ifdef CONFIG_KSU\
          \tksu_handle_stat(&dfd, &filename, &flag);\
          #endif
                      }
                    }' fs/stat.c
                    echo "Patched fs/stat.c (newfstatat)"
          
                    # 5) kernel/reboot.c → SYSCALL_DEFINE4(reboot...)
                    sed -i '/SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,$/{
                      N
                      /void __user \*, arg)/{
                        /struct pid_namespace/{
                          i\
          #ifdef CONFIG_KSU\
          \tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\
          #endif
                        }
                      }
                    }' kernel/reboot.c
                    echo "Patched kernel/reboot.c (reboot)"
          
                    # Verify hooks
                    for check in \
                      'fs/exec.c:ksu_handle_execveat' \
                      'fs/open.c:ksu_handle_faccessat' \
                      'fs/read_write.c:ksu_handle_sys_read' \
                      'fs/stat.c:ksu_handle_stat' \
                      'kernel/reboot.c:ksu_handle_sys_reboot'; do
                      f="${check%%:*}"
                      s="${check##*:}"
                      if grep -q "$s" "$f"; then
                        echo "  ✅ $f: $s"
                      else
                        echo "  ❌ $f: $s MISSING"
                        exit 1
                      fi
                    done

          echo "✅ Official KSU Next hooks applied"
          
      - name: "🔍 Check driver build integration"
        working-directory: ./kernel
        run: |
          echo "=== Does drivers/Makefile include kernelsu? ==="
          grep -n 'kernelsu' drivers/Makefile || echo "NOT FOUND"
          echo ""
          echo "=== Does drivers/Kconfig source kernelsu? ==="
          grep -n 'kernelsu' drivers/Kconfig || echo "NOT FOUND"
          echo ""
          echo "=== Contents of drivers/kernelsu/Makefile ==="
          cat drivers/kernelsu/Makefile 2>/dev/null || echo "FILE MISSING"
          echo ""
          echo "=== Contents of drivers/kernelsu/Kconfig ==="
          cat drivers/kernelsu/Kconfig 2>/dev/null || echo "FILE MISSING"
          echo ""
          echo "=== All CONFIG_KSU lines in .config ==="
          grep 'CONFIG_KSU' out/.config 2>/dev/null || echo ".config not found yet"
      
      - name: "[7/8] Cleanup"
        working-directory: ./kernel
        run: |
          grep -rIl 'MODULE_IMPORT_NS' drivers/kernelsu/ 2>/dev/null | while read f; do sed -i '/MODULE_IMPORT_NS/d' "$f"; done
          [ -f include/linux/compiler_types.h ] || echo '#include <linux/compiler.h>' > include/linux/compiler_types.h
          echo "OK"

      - name: "🔍 Diagnostic: Show syscall definitions"
        working-directory: ./kernel
        run: |
          echo "=== exec.c execveat definition ==="
          grep -n "SYSCALL_DEFINE.*execveat" fs/exec.c || echo "NOT FOUND"
          echo ""
          echo "=== open.c open definition ==="
          grep -n "SYSCALL_DEFINE.*open" fs/open.c || echo "NOT FOUND"
          echo ""
          echo "=== read_write.c read definition ==="
          grep -n "SYSCALL_DEFINE.*read" fs/read_write.c || echo "NOT FOUND"
          echo ""
          echo "=== stat.c newstat definition ==="
          grep -n "SYSCALL_DEFINE.*newstat" fs/stat.c || echo "NOT FOUND"
          echo ""
          echo "=== fork.c clone definition ==="
          grep -n "SYSCALL_DEFINE.*clone" kernel/fork.c || echo "NOT FOUND"
      
      - name: "[8/8] Build kernel"
        working-directory: ./kernel
        run: |
          make O=out ARCH=arm64 exynos7885-a20_defconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- 2>&1 | tee build.log

      - name: "📋 Show build errors (if any)"
        if: always()   # run even if the build step failed
        working-directory: ./kernel
        run: |
          echo "============================="
          echo " BUILD ERROR SUMMARY"
          echo "============================="
          if grep -E 'error:|fatal error' build.log > /tmp/errors.txt; then
            echo "First 20 errors (full list in build.log):"
            head -20 /tmp/errors.txt
            echo ""
            echo "Total error lines: $(wc -l < /tmp/errors.txt)"
          else
            echo "No compilation errors found."
          fi
          echo "============================="
      
      - name: "🔍 Show driver build errors"
        working-directory: ./kernel
        run: |
          echo "=== All lines mentioning 'kernelsu' in build.log ==="
          grep -i 'kernelsu' build.log || echo "(no lines found)"
          echo ""
          echo "=== Suspected errors (ld.lld / undefined) ==="
          grep -E 'undefined|ld.lld: error' build.log || echo "(no linker errors)"
      
      - name: "Final verify"
        working-directory: ./kernel
        run: |
          grep -q "^CONFIG_KSU=y" out/.config || { echo "FAIL1"; exit 1; }
          [ -f out/drivers/kernelsu/ksu.o ] || [ -f out/drivers/kernelsu/built-in.o ] || { echo "FAIL2"; exit 1; }
          [ -f out/arch/arm64/boot/Image ] || { echo "FAIL3"; exit 1; }
          strings out/arch/arm64/boot/Image | grep -q "KernelSU" || { echo "FAIL4"; exit 1; }
          cp out/arch/arm64/boot/Image .
          echo "ALL OK"

      - name: "📦 Create flashable ZIP"
        id: zip
        run: |
          VERSION="${{ github.event.inputs.ksu_version }}"
          VERSION="${VERSION:-v3.1.0-legacy}"
          BUILD_NO=$(printf "%03d" ${{ github.run_number }})
          ZIP_NAME="ksu-next-${VERSION}-a20-${BUILD_NO}"
          cd anykernel
          zip -r9 "../${ZIP_NAME}.zip" .
          cd ..
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: "Upload"
        uses: actions/upload-artifact@v4
        with:
          name: ksu-${{ github.run_number }}
          path: |
            ksu.zip
            kernel/build.log
