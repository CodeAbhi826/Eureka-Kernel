name: Build KSU Next Legacy

on:
  push:
    branches: [ "R15-OneUI" ]
    paths:
      - '.github/workflows/build-ksun.yml'
  workflow_dispatch:
    inputs:
      ksu_version:
        description: 'KernelSU Next version (legacy)'
        type: choice
        required: true
        default: 'v3.1.0-legacy'
        options:
          - 'v3.1.0-legacy'
          - 'v3.1.0-legacy-susfs'
          - 'v3.0.1-legacy'
          - 'v3.0.0'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: "[0/8] Checkout Eureka Kernel source"
        uses: actions/checkout@v4
        with:
          repository: eurekadevelopment/Eureka-Kernel
          ref: R15-OneUI
          path: kernel

      - name: "Verify checkout"
        run: |
          [ -f kernel/Makefile ] || { echo "FAIL"; exit 1; }
          echo "OK"

      - name: "[1/8] Install dependencies"
        run: |
          sudo apt update -qq
          sudo apt install -y bc bison flex libssl-dev make git python3 cpio gcc-aarch64-linux-gnu
          # Enable universe repo (required for coccinelle on Ubuntu 24.04)
          sudo add-apt-repository -y universe
          sudo apt update -qq
          sudo apt install -y coccinelle
          # Verify spatch (the Coccinelle binary) is available
          command -v spatch || { echo "spatch not found"; exit 1; }

      - name: "Verify deps"
        run: |
          for tool in bc bison flex make git python3 spatch aarch64-linux-gnu-gcc; do
            command -v $tool || { echo "MISSING: $tool"; exit 1; }
          done
          echo "OK"

      - name: "[2/8] Neutron Clang toolchain"
        run: |
          mkdir -p toolchain && cd toolchain
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S=10032024
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") --patch=glibc
          cd ..
          echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH

      - name: "Verify toolchain"
        run: |
          export PATH="$(pwd)/toolchain/bin:$PATH"
          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            command -v $tool || { echo "MISSING: $tool"; exit 1; }
          done
          echo "OK"

      - name: "[3/8] Set env vars"
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV

      - name: "Verify env"
        run: |
          [ "$ARCH" = "arm64" ] || { echo "BAD ARCH"; exit 1; }
          echo "OK"

      - name: "[4/8] Patch defconfig"
        working-directory: ./kernel
        run: |
          D="arch/arm64/configs/exynos7885-a20_defconfig"
          grep -q "CONFIG_KALLSYMS=y" "$D" || echo "CONFIG_KALLSYMS=y" >> "$D"
          grep -q "CONFIG_KALLSYMS_ALL=y" "$D" || echo "CONFIG_KALLSYMS_ALL=y" >> "$D"
          grep -q "CONFIG_KSU=y" "$D" || echo "CONFIG_KSU=y" >> "$D"
          sed -i 's/^CONFIG_KPROBES=y/# CONFIG_KPROBES is not set/' "$D"
          sed -i 's/^CONFIG_KRETPROBES=y/# CONFIG_KRETPROBES is not set/' "$D"
          sed -i 's/^CONFIG_LTO=y/# CONFIG_LTO is not set/' "$D"
          grep -q "CONFIG_SIPHASH=y" "$D" || echo "CONFIG_SIPHASH=y" >> "$D"
          for s in CONFIG_KSU=y CONFIG_KALLSYMS=y CONFIG_KALLSYMS_ALL=y CONFIG_SIPHASH=y; do
            grep -q "^$s" "$D" || { echo "MISSING: $s"; exit 1; }
          done
          echo "OK"
          # Allow dmesg without root (debug KSU)
          grep -q "CONFIG_SECURITY_DMESG_RESTRICT" "$D" && sed -i 's/^CONFIG_SECURITY_DMESG_RESTRICT=y/# CONFIG_SECURITY_DMESG_RESTRICT is not set/' "$D" || echo "# CONFIG_SECURITY_DMESG_RESTRICT is not set" >> "$D"
          # Enable KSU internal debug prints
          grep -q "CONFIG_KSU_DEBUG=y" "$D" || echo "CONFIG_KSU_DEBUG=y" >> "$D"
                    
      - name: "[5/8] Integrate KSU Next Legacy"
        run: |
          V="${{ github.event.inputs.ksu_version }}"
          V="${V:-v3.1.0-legacy}"
          echo "Using KSU version: ${V}"
      
          # Download driver
          mkdir -p /tmp/ksu-src
          curl -L "https://github.com/KernelSU-Next/KernelSU-Next/archive/refs/tags/${V}.tar.gz" | tar xz -C /tmp/ksu-src --strip-components=1
          # Ensure source exists
          if [ ! -d /tmp/ksu-src/kernel ]; then
            echo "ERROR: /tmp/ksu-src/kernel not found – tarball extraction may have failed"
            ls -la /tmp/ksu-src/
            exit 1
          fi
          
          # Create destination tree (handles missing drivers/ gracefully)
          mkdir -p drivers/kernelsu
          cp -r /tmp/ksu-src/kernel/* drivers/kernelsu/
                
          # Run official setup.sh (legacy mode)
          bash drivers/kernelsu/setup.sh legacy
      
          # Replace module Makefile with in-tree Kbuild
          cat > drivers/kernelsu/Kbuild << 'EOF'
          obj-$(CONFIG_KSU) += kernelsu.o
          kernelsu-objs := core/kernel_compat.o core/ksud.o core/selinux/selinux.o \
                           core/selinux/sepolicy.o core/selinux/rules.o \
                           core/selinux/avc.o core/selinux/ss/services.o \
                           core/selinux/ss/policydb.o core/selinux/ss/avtab.o \
                           core/selinux/ss/sidtab.o core/selinux/ss/context.o \
                           core/selinux/ss/mls.o core/selinux/ss/ebitmap.o \
                           core/selinux/ss/hashtab.o core/selinux/ss/symtab.o \
                           core/selinux/ss/status.o core/suid/suid.o \
                           core/module/misc.o core/uid_inode_map.o \
                           core/module/ksud_socket.o core/apk_sign.o \
                           compat_backport.o
          EOF
          rm -f drivers/kernelsu/Makefile
      
          # kvmalloc/kvfree backport
          cat > drivers/kernelsu/compat_backport.c << 'EOF'
          #include <linux/slab.h>
          #include <linux/vmalloc.h>
          #include <linux/mm.h>
          #include <linux/gfp.h>
      
          void *kvmalloc(size_t size, gfp_t flags)
          {
              void *ret;
              if (size > PAGE_SIZE) {
                  ret = __vmalloc(size, flags, PAGE_KERNEL);
                  if (ret) return ret;
              }
              ret = kmalloc(size, flags | __GFP_NOWARN);
              if (!ret && size > PAGE_SIZE)
                  ret = __vmalloc(size, flags, PAGE_KERNEL);
              return ret;
          }
      
          void kvfree(const void *addr)
          {
              if (is_vmalloc_addr(addr))
                  vfree(addr);
              else
                  kfree(addr);
          }
          EOF
      
          # Remove MODULE_IMPORT_NS and stub compiler_types.h
          find drivers/kernelsu -type f -name '*.c' -exec sed -i 's/MODULE_IMPORT_NS(.*);//' {} \;
          find drivers/kernelsu -type f -name '*.h' -exec sed -i 's/MODULE_IMPORT_NS(.*);//' {} \;
          if [ ! -f include/linux/compiler_types.h ]; then
            touch include/linux/compiler_types.h
          fi
      
          # Create hook header with real prototypes
          cat > include/linux/kernelsu_hook.h << 'EOF'
          #ifndef _LINUX_KERNELSU_HOOK_H
          #define _LINUX_KERNELSU_HOOK_H
          int ksu_handle_execveat(const char __user *filename,
                                  const char __user *const __user *argv,
                                  const char __user *const __user *envp, int flags);
          int ksu_handle_open(int dfd, const char __user *filename, int flags, umode_t mode);
          int ksu_handle_read(unsigned int fd, char __user *buf, size_t count);
          int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
          int ksu_handle_clone(unsigned long clone_flags, unsigned long newsp,
                               int __user *parent_tidptr, int __user *child_tidptr, unsigned long tls);
          int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user *arg);
          #endif
          EOF
      
          # Inject hooks (exec, open, read, fork)
          python3 << 'PYEOF'
          import re
      
          # fs/exec.c
          with open('fs/exec.c', 'r') as f:
              exec_c = f.read()
          hook = '\tint ksu = ksu_handle_execveat(filename, argv, envp, flags);\n\tif (unlikely(ksu)) return ksu;\n'
          exec_c = re.sub(r'(\tstruct task_struct \*tsk = current;\n)', r'\1' + hook, exec_c, count=1)
          with open('fs/exec.c', 'w') as f:
              f.write(exec_c)
      
          # fs/open.c
          with open('fs/open.c', 'r') as f:
              open_c = f.read()
          hook = '\tint ksu = ksu_handle_open(AT_FDCWD, filename, flags, mode);\n\tif (unlikely(ksu)) return ksu;\n'
          open_c = re.sub(r'(\tint op = flags & O_TMPFILE \? )', r'\1' + hook, open_c, count=1)
          with open('fs/open.c', 'w') as f:
              f.write(open_c)
      
          # fs/read_write.c
          with open('fs/read_write.c', 'r') as f:
              rw_c = f.read()
          hook = '\tint ksu = ksu_handle_read(fd, buf, count);\n\tif (unlikely(ksu)) return ksu;\n'
          rw_c = re.sub(r'(\tssize_t ret = -EBADF;\n)', r'\1' + hook, rw_c, count=1)
          with open('fs/read_write.c', 'w') as f:
              f.write(rw_c)
      
          # kernel/fork.c
          with open('kernel/fork.c', 'r') as f:
              fork_c = f.read()
          hook = '\tint ksu = ksu_handle_clone(clone_flags, newsp, parent_tidptr, child_tidptr, tls);\n\tif (unlikely(ksu)) return ksu;\n'
          fork_c = re.sub(r'(\tu64 __maybe_unused tls_space\[2\];\n)', r'\1' + hook, fork_c, count=1)
          with open('kernel/fork.c', 'w') as f:
              f.write(fork_c)
          PYEOF
      
          # ---------- Clean old KSU externs (bulletproof version) ----------
          # Remove entire old extern block (single or multi-line)
          awk 'BEGIN{skip=0}
               /extern int ksu_handle_execveat/ {skip=1}
               skip && /\);$/ {skip=0; next}
               !skip' fs/exec.c > fs/exec.c.tmp && mv fs/exec.c.tmp fs/exec.c
      
          # Purge old call with the broken signature
          sed -i '/ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags)/d' fs/exec.c
      
          # Remove old stat hook extern and its usage
          sed -i '/^extern int ksu_handle_stat/d' fs/stat.c
          sed -i '/ksu_handle_stat(/d' fs/stat.c
      
          # Remove old open/read externs
          sed -i '/^extern int ksu_handle_open/d' fs/open.c
          sed -i '/^extern int ksu_handle_read/d' fs/read_write.c
          # -----------------------------------------------------------------
      
          # Inject reboot hook (separate script, no indentation issues)
          python3 << 'PYEOF2'
          with open('kernel/reboot.c', 'r') as f:
              rb = f.read()
          import re
          hook = '\tint ksu = ksu_handle_sys_reboot(magic1, magic2, cmd, arg);\n\tif (unlikely(ksu)) return ksu;\n'
          rb = re.sub(r'(\tif \(cmd >= LINUX_REBOOT_CMD_MAX\)\n\t\treturn -EINVAL;\n)', r'\1' + hook, rb, count=1)
          with open('kernel/reboot.c', 'w') as f:
              f.write(rb)
          PYEOF2
      
          # Final verification
          echo "Checking hooks..."
          grep -q "ksu_handle_execveat(filename, argv, envp, flags)" fs/exec.c && echo "✓ exec hook present" || echo "✗ MISSING exec hook"
          grep -q "ksu_handle_open(AT_FDCWD, filename, flags, mode)" fs/open.c && echo "✓ open hook present" || echo "✗ MISSING open hook"
          grep -q "ksu_handle_read(fd, buf, count)" fs/read_write.c && echo "✓ read hook present" || echo "✗ MISSING read hook"
          grep -q "ksu_handle_clone(clone_flags, newsp, parent_tidptr, child_tidptr, tls)" kernel/fork.c && echo "✓ clone hook present" || echo "✗ MISSING clone hook"
          grep -q "ksu_handle_sys_reboot(magic1, magic2, cmd, arg)" kernel/reboot.c && echo "✓ reboot hook present" || echo "✗ MISSING reboot hook"
          echo "✅ All hooks present and driver ready for in‑tree build"
          
      - name: "🔍 Check driver build integration"
        working-directory: ./kernel
        run: |
          echo "=== Does drivers/Makefile include kernelsu? ==="
          grep -n 'kernelsu' drivers/Makefile || echo "NOT FOUND"
          echo ""
          echo "=== Does drivers/Kconfig source kernelsu? ==="
          grep -n 'kernelsu' drivers/Kconfig || echo "NOT FOUND"
          echo ""
          echo "=== Contents of drivers/kernelsu/Makefile ==="
          cat drivers/kernelsu/Makefile 2>/dev/null || echo "FILE MISSING"
          echo ""
          echo "=== Contents of drivers/kernelsu/Kconfig ==="
          cat drivers/kernelsu/Kconfig 2>/dev/null || echo "FILE MISSING"
          echo ""
          echo "=== All CONFIG_KSU lines in .config ==="
          grep 'CONFIG_KSU' out/.config 2>/dev/null || echo ".config not found yet"
      
      - name: "[7/8] Cleanup"
        working-directory: ./kernel
        run: |
          grep -rIl 'MODULE_IMPORT_NS' drivers/kernelsu/ 2>/dev/null | while read f; do sed -i '/MODULE_IMPORT_NS/d' "$f"; done
          [ -f include/linux/compiler_types.h ] || echo '#include <linux/compiler.h>' > include/linux/compiler_types.h
          echo "OK"

      - name: "🔍 Diagnostic: Show syscall definitions"
        working-directory: ./kernel
        run: |
          echo "=== exec.c execveat definition ==="
          grep -n "SYSCALL_DEFINE.*execveat" fs/exec.c || echo "NOT FOUND"
          echo ""
          echo "=== open.c open definition ==="
          grep -n "SYSCALL_DEFINE.*open" fs/open.c || echo "NOT FOUND"
          echo ""
          echo "=== read_write.c read definition ==="
          grep -n "SYSCALL_DEFINE.*read" fs/read_write.c || echo "NOT FOUND"
          echo ""
          echo "=== stat.c newstat definition ==="
          grep -n "SYSCALL_DEFINE.*newstat" fs/stat.c || echo "NOT FOUND"
          echo ""
          echo "=== fork.c clone definition ==="
          grep -n "SYSCALL_DEFINE.*clone" kernel/fork.c || echo "NOT FOUND"
      
      - name: "[8/8] Build kernel"
        working-directory: ./kernel
        run: |
          make O=out ARCH=arm64 exynos7885-a20_defconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- 2>&1 | tee build.log

      - name: "📋 Show build errors (if any)"
        if: always()   # run even if the build step failed
        working-directory: ./kernel
        run: |
          echo "============================="
          echo " BUILD ERROR SUMMARY"
          echo "============================="
          if grep -E 'error:|fatal error' build.log > /tmp/errors.txt; then
            echo "First 20 errors (full list in build.log):"
            head -20 /tmp/errors.txt
            echo ""
            echo "Total error lines: $(wc -l < /tmp/errors.txt)"
          else
            echo "No compilation errors found."
          fi
          echo "============================="
      
      - name: "🔍 Show driver build errors"
        working-directory: ./kernel
        run: |
          echo "=== All lines mentioning 'kernelsu' in build.log ==="
          grep -i 'kernelsu' build.log || echo "(no lines found)"
          echo ""
          echo "=== Suspected errors (ld.lld / undefined) ==="
          grep -E 'undefined|ld.lld: error' build.log || echo "(no linker errors)"
      
      - name: "Final verify"
        working-directory: ./kernel
        run: |
          grep -q "^CONFIG_KSU=y" out/.config || { echo "FAIL1"; exit 1; }
          [ -f out/drivers/kernelsu/ksu.o ] || [ -f out/drivers/kernelsu/built-in.o ] || { echo "FAIL2"; exit 1; }
          [ -f out/arch/arm64/boot/Image ] || { echo "FAIL3"; exit 1; }
          strings out/arch/arm64/boot/Image | grep -q "KernelSU" || { echo "FAIL4"; exit 1; }
          cp out/arch/arm64/boot/Image .
          echo "ALL OK"

      - name: "📦 Create flashable ZIP"
        id: zip
        run: |
          VERSION="${{ github.event.inputs.ksu_version }}"
          VERSION="${VERSION:-v3.1.0-legacy}"
          BUILD_NO=$(printf "%03d" ${{ github.run_number }})
          ZIP_NAME="ksu-next-${VERSION}-a20-${BUILD_NO}"
          cd anykernel
          zip -r9 "../${ZIP_NAME}.zip" .
          cd ..
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: "Upload"
        uses: actions/upload-artifact@v4
        with:
          name: ksu-${{ github.run_number }}
          path: |
            ksu.zip
            kernel/build.log
